      description: >-
        Devuelve los indicadores y las series que alimentan la vista previa del
        reporte. Solo considera carteras donde el usuario es propietario y que
        no estén archivadas, y transacciones no eliminadas. Los filtros se
        pueden combinar: cartera, tipo de cartera, periodo, rango de fechas y
        cantidad de categorías en la gráfica.
      operationId: vistaPreviaReporte
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: carteraId
          required: false
          description: Limita el reporte a una cartera del propietario.
          schema:
            type: integer
        - in: query
          name: tipo
          required: false
          description: Filtra por tipo de cartera.
          schema:
            type: string
            enum:
              - HOGAR
              - VIAJE
              - EVENTO
              - OTRO
        - in: query
          name: periodoId
          required: false
          description: Periodo de la cartera indicada en carteraId.
          schema:
            type: integer
        - in: query
          name: fechaInicio
          required: false
          description: Fecha inicial en formato YYYY-MM-DD.
          schema:
            type: string
            format: date
        - in: query
          name: fechaFin
          required: false
          description: Fecha final en formato YYYY-MM-DD (incluida).
          schema:
            type: string
            format: date
        - in: query
          name: cantidad
          required: false
          description: Número de categorías en la gráfica (1 a 50, por defecto 5).
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 5
      responses:
        '200':
          description: Vista previa del reporte
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      hayDatos:
                        type: boolean
                        example: true
                      filtros:
                        type: object
                        properties:
                          carteraId:
                            type: integer
                            nullable: true
                          tipo:
                            type: string
                            nullable: true
                            example: HOGAR
                          periodoId:
                            type: integer
                            nullable: true
                          fechaInicio:
                            type: string
                            nullable: true
                            example: '2026-11-01'
                          fechaFin:
                            type: string
                            nullable: true
                            example: '2026-11-30'
                          cantidad:
                            type: integer
                            example: 5
                      carteras:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: integer
                              example: 4
                            nombre:
                              type: string
                              example: Casa Aidee
                            tipo:
                              type: string
                              example: HOGAR
                      indicadores:
                        type: object
                        properties:
                          totalIngresos:
                            type: number
                            example: 1500.0
                          totalGastos:
                            type: number
                            example: 250.0
                          ahorro:
                            type: number
                            example: 1250.0
                          totalAportes:
                            type: number
                            example: 1500.0
                          movimientos:
                            type: integer
                            example: 2
                      graficas:
                        type: object
                        properties:
                          gastosPorCategoria:
                            type: array
                            items:
                              type: object
                              properties:
                                categoria:
                                  type: string
                                  example: Garnachas
                                monto:
                                  type: number
                                  example: 250.0
                                porcentaje:
                                  type: number
                                  example: 100.0
                          ingresosVsEgresos:
                            type: array
                            items:
                              type: object
                              properties:
                                periodo:
                                  type: string
                                  example: '2026-11'
                                ingresos:
                                  type: number
                                  example: 1500.0
                                gastos:
                                  type: number
                                  example: 250.0
                  mensaje:
                    type: string
                    example: Vista previa del reporte generada correctamente.
        '400':
          description: >-
            Filtros inválidos: tipo desconocido, cantidad fuera de rango, fechas
            mal formadas, rango invertido o periodo sin cartera
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Token no proporcionado o inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: La cartera no existe o el usuario no es su propietario
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: No se pudo generar la vista previa del reporte
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /reportes/exportar:
    get:
      tags:
        - Reportes
      summary: Generar y descargar el reporte
      description: >-
        Genera el archivo del reporte con los mismos filtros de la vista previa.
        Devuelve CSV (UTF-8 con BOM para Excel) o PDF. El encabezado incluye
        cartera(s), periodo, fecha de generación y totales. Solo considera
        carteras donde el usuario es propietario, no archivadas, y transacciones
        no eliminadas.
      operationId: exportarReporte
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: formato
          required: false
          description: Formato del archivo: CSV o PDF.
          schema:
            type: string
            enum:
              - CSV
              - PDF
            default: CSV
        - in: query
          name: carteraId
          required: false
          schema:
            type: integer
        - in: query
          name: tipo
          required: false
          schema:
            type: string
            enum:
              - HOGAR
              - VIAJE
              - EVENTO
              - OTRO
        - in: query
          name: periodoId
          required: false
          description: Requiere carteraId.
          schema:
            type: integer
        - in: query
          name: fechaInicio
          required: false
          schema:
            type: string
            format: date
        - in: query
          name: fechaFin
          required: false
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Archivo del reporte
          content:
            text/csv:
              schema:
                type: string
                format: binary
            application/pdf:
              schema:
                type: string
                format: binary
          headers:
            Content-Disposition:
              description: Nombre del archivo, p. ej. reporte_20261111.csv o .pdf
              schema:
                type: string
        '400':
          description: >-
            Formato no disponible o filtros inválidos (tipo, fechas, periodo
            sin cartera)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Token no proporcionado o inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: La cartera no existe o el usuario no es su propietario
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Sin datos para los filtros seleccionados; no se genera archivo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: No se pudo generar el reporte
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /comentarios:
    post:
      tags:
        - Comentarios
      summary: Enviar un comentario desde la landing
      description: >-
        Endpoint público (sin sesión). Valida nombre, correo y mensaje, y aplica
        un límite anti-spam de 3 comentarios por IP cada 10 minutos.
      operationId: crearComentario
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ComentarioRequest'
            example:
              nombre: Aideé Casillas
              correo: aidee@ejemplo.com
              comentario: Me gustó la app, ¿tienen versión de escritorio?
      responses:
        '201':
          description: Comentario registrado con estado PENDIENTE
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/Comentario'
                  mensaje:
                    type: string
                    example: Comentario creado correctamente.
        '400':
          description: >-
            Datos inválidos: campos faltantes o vacíos, longitudes excedidas
            (nombre 120, correo 254, comentario 2000) o correo mal formado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Límite de comentarios por IP excedido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: No se pudo guardar el comentario
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    get:
      tags:
        - Comentarios
      summary: Ver el buzón de comentarios de la landing
      description: >-
        Devuelve todos los comentarios enviados desde la landing, del más
        reciente al más antiguo. Solo para staff (ADMIN o TRABAJADOR). No
        expone la IP de origen.
      operationId: listarComentarios
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Buzón de comentarios
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Comentario'
                  mensaje:
                    type: string
                    example: Comentarios obtenidos correctamente.
        '401':
          description: Token no proporcionado o inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: El usuario no es ADMIN ni TRABAJADOR
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: No se pudieron obtener los comentarios
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    RegistroRequest:
      type: object
      required:
        - nombreUsuario
        - apaterno
        - correo
        - contrasenia
      properties:
        nombreUsuario:
          type: string
          maxLength: 80
          example: Damian
        apaterno:
          type: string
          maxLength: 80
          example: Rodriguez
        amaterno:
          type: string
          maxLength: 80
          nullable: true
          example: Alarcon
        correo:
          type: string
          maxLength: 254
          format: email
          example: prueba1@dominio.com
        contrasenia:
          type: string
          minLength: 8
          description: Mínimo 8 caracteres, al menos una mayúscula y un número.
          example: Password1
    LoginRequest:
      type: object
      required:
        - correo
        - contrasenia
      properties:
        correo:
          type: string
          format: email
          example: prueba1@dominio.com
        contrasenia:
          type: string
          example: Password1
    RefreshRequest:
      type: object
      required:
        - refresh_token
      properties:
        refresh_token:
          type: string
    Usuario:
      type: object
      properties:
        idUsuario:
          type: integer
          example: 1
        nombreUsuario:
          type: string
          example: Damian
        apaterno:
          type: string
          example: Rodriguez
        amaterno:
          type: string
          nullable: true
          example: Alarcon
        correo:
          type: string
          example: prueba1@dominio.com
        rolGlobal:
          type: string
          enum:
            - CLIENTE
            - TRABAJADOR
            - ADMIN
          example: CLIENTE
        estado:
          type: string
          enum:
            - ACTIVO
            - INACTIVO
            - ELIMINADO
          example: ACTIVO
        fechaRegistro:
          type: string
          description: Fecha en formato HTTP-date (RFC 1123).
          example: 'Wed, 21 Oct 2026 18:38:51 GMT'
        fechaBaja:
          type: string
          nullable: true
          description: Baja lógica. Se llena cuando la cuenta se elimina; en INACTIVO queda null.
          example: 'Wed, 26 Oct 2026 18:38:51 GMT'
        tema:
          type: string
          enum:
            - CLARO
            - OSCURO
          description: Preferencia de tema guardada. Por defecto CLARO.
          example: CLARO
    RegistroExitoso:
      type: object
      properties:
        ok:
          type: boolean
          example: true
        data:
          $ref: '#/components/schemas/Usuario'
        mensaje:
          type: string
          example: Cuenta creada correctamente.
    SesionExitosa:
      type: object
      properties:
        ok:
          type: boolean
          example: true
        data:
          type: object
          properties:
            access_token:
              type: string
            refresh_token:
              type: string
            token_type:
              type: string
              example: Bearer
            expires_in:
              type: integer
              example: 900
            usuario:
              $ref: '#/components/schemas/Usuario'
        mensaje:
          type: string
          example: Sesión iniciada correctamente.
    TokenRenovado:
      type: object
      properties:
        ok:
          type: boolean
          example: true
        data:
          type: object
          properties:
            access_token:
              type: string
            token_type:
              type: string
              example: Bearer
            expires_in:
              type: integer
              example: 900
        mensaje:
          type: string
          example: Token renovado correctamente.
    RecuperarRequest:
      type: object
      required:
        - correo
      properties:
        correo:
          type: string
          format: email
          example: prueba1@dominio.com
    RestablecerRequest:
      type: object
      required:
        - correo
        - codigo
        - contrasenia
      properties:
        correo:
          type: string
          format: email
          example: prueba1@dominio.com
        codigo:
          type: string
          minLength: 6
          maxLength: 6
          example: '123456'
        contrasenia:
          type: string
          description: Mínimo 8 caracteres, al menos una mayúscula y un número.
          example: NuevaPassword1
    CambiarContrasenaRequest:
      type: object
      required:
        - actual
        - nueva
      properties:
        actual:
          type: string
          example: Password1
        nueva:
          type: string
          description: Mínimo 8 caracteres, al menos una mayúscula y un número. Debe ser distinta a la actual.
          example: NuevaPassword1
    ConfirmacionCuentaRequest:
      type: object
      required:
        - contrasenia
      properties:
        contrasenia:
          type: string
          example: Password1
    RecuperacionSolicitada:
      type: object
      properties:
        ok:
          type: boolean
          example: true
        data:
          type: object
          nullable: true
          description: En producción es null. En desarrollo incluye el código para pruebas.
          properties:
            codigo:
              type: string
              example: '123456'
        mensaje:
          type: string
          example: Si el correo esta registrado, recibiras un codigo de recuperacion
    PreferenciasRequest:
      type: object
      description: Campos opcionales; debe enviarse al menos uno.
      properties:
        tema:
          type: string
          enum:
            - CLARO
            - OSCURO
          example: OSCURO
        notificacionesMovimientos:
          type: boolean
          description: Avisos de movimientos en mis carteras.
          example: true
        notificacionesSistema:
          type: boolean
          description: Recordatorios del sistema.
          example: true
        notificacionesPagos:
          type: boolean
          description: Recordatorios de pagos recurrentes.
          example: false
    Error:
      type: object
      properties:
        ok:
          type: boolean
          example: false
        mensaje:
          type: string
          example: El correo ya está registrado.
    CarteraCrearRequest:
      type: object
      required:
        - nombre
        - tipo
      properties:
        nombre:
          type: string
          maxLength: 100
          example: Casa Borja
        tipo:
          type: string
          enum:
            - HOGAR
            - VIAJE
            - EVENTO
            - OTRO
            - OTRA
          example: HOGAR
        descripcion:
          type: string
          maxLength: 500
          nullable: true
          example: Gastos del hogar
        presupuestoInicial:
          type: number
          minimum: 0
          default: 0
          example: 5000
        fechaInicio:
          type: string
          format: date
          nullable: true
          example: '2026-11-01'
        fechaFin:
          type: string
          format: date
          nullable: true
          example: '2026-11-30'
    Cartera:
      type: object
      properties:
