openapi: 3.0.3
info:
  title: FinanzApp API
  description: Contrato de la API REST de FinanzApp (Flask + SQL Server).
  version: 0.4.0
servers:
  - url: http://127.0.0.1:5000
    description: Desarrollo local
tags:
  - name: Auth
    description: Registro, sesión y recuperación de cuenta
  - name: Carteras
    description: Creación y consulta de carteras
paths:
  /auth/registro:
    post:
      tags:
        - Auth
      summary: Registrar una cuenta
      description: Crea una cuenta con rol CLIENTE y estado ACTIVO. El correo es único y la contraseña se guarda con hash.
      operationId: registrarCuenta
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistroRequest'
            example:
              nombreUsuario: Damian
              apaterno: Rodriguez
              amaterno: Alarcon
              correo: prueba1@dominio.com
              contrasenia: Password1
      responses:
        '201':
          description: Cuenta creada correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistroExitoso'
        '400':
          description: Datos inválidos (campos faltantes, correo mal formado o contraseña débil)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                ok: false
                mensaje: 'Faltan campos: nombreUsuario,apaterno,correo,contrasenia.'
        '409':
          description: El correo ya está registrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                ok: false
                mensaje: El correo ya está registrado.
  /auth/login:
    post:
      tags:
        - Auth
      summary: Iniciar sesión
      description: Valida credenciales y cuenta activa. Devuelve un access token JWT con el rol y un refresh token de sesión.
      operationId: iniciarSesion
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              correo: prueba1@dominio.com
              contrasenia: Password1
      responses:
        '200':
          description: Sesión iniciada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SesionExitosa'
        '400':
          description: Faltan correo o contraseña
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                ok: false
                mensaje: Correo y contraseña son obligatorios.
        '401':
          description: Credenciales incorrectas o cuenta inactiva (mensaje neutro)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                ok: false
                mensaje: Credenciales incorrectas.
  /auth/refresh:
    post:
      tags:
        - Auth
      summary: Renovar el access token
      description: Recibe el refresh token de una sesión activa y devuelve un nuevo access token.
      operationId: renovarToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
            example:
              refresh_token: egL8PpKyiAybe1d_9nLq90OIgyrFOqfIaeCrqj-GwBAhZY8CgqWDVqm7p8SHMAtD
      responses:
        '200':
          description: Token renovado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRenovado'
        '400':
          description: Falta el refresh token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Sesión inválida, revocada o expirada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                ok: false
                mensaje: Sesión inválida o expirada.
  /auth/logout:
    post:
      tags:
        - Auth
      summary: Cerrar sesión
      description: Revoca la sesión asociada al access token. El token deja de ser válido.
      operationId: cerrarSesion
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Sesión cerrada
          content:
            application/json:
              example:
                ok: true
                data: null
                mensaje: Sesión cerrada correctamente.
        '401':
          description: Token ausente, inválido, expirado o sesión ya revocada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                ok: false
                mensaje: Sesión cerrada o inválida.
  /auth/recuperar:
    post:
      tags:
        - Auth
      summary: Solicitar código de recuperación
      description: Genera un código de 6 dígitos con vigencia de 30 minutos. Siempre responde con un mensaje neutro para no revelar si el correo existe.
      operationId: solicitarRecuperacion
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecuperarRequest'
            example:
              correo: prueba1@dominio.com
      responses:
        '200':
          description: Solicitud procesada (mensaje neutro)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecuperacionSolicitada'
              example:
                ok: true
                data:
                  codigo: '123456'
                mensaje: Si el correo esta registrado, recibiras un codigo de recuperacion
        '400':
          description: Cuerpo inválido o correo con formato incorrecto
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /auth/restablecer:
    post:
      tags:
        - Auth
      summary: Restablecer contraseña con código
      description: Valida el código vigente y de un solo uso, actualiza la contraseña y revoca las sesiones activas.
      operationId: restablecerContrasenia
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RestablecerRequest'
            example:
              correo: prueba1@dominio.com
              codigo: '123456'
              contrasenia: NuevaPassword1
      responses:
        '200':
          description: Contraseña actualizada
          content:
            application/json:
              example:
                ok: true
                data: null
                mensaje: Contraseña actualizada correctamente.
        '400':
          description: Código inválido, expirado o ya usado; o contraseña que no cumple la política
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                ok: false
                mensaje: El código no es válido o ya expiró.
  /carteras:
    get:
      tags:
        - Carteras
      summary: Listar mis carteras
      description: Devuelve las carteras activas donde el usuario es propietario o colaborador.
      operationId: listarCarteras
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Listado de carteras
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CarterasLista'
        '401':
          description: Token no proporcionado o inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: No se pudieron obtener las carteras
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      tags:
        - Carteras
      summary: Crear una cartera
      description: Crea una cartera con el usuario actual como propietario y estado ACTIVA.
      operationId: crearCartera
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CarteraCrearRequest'
            example:
              nombre: Casa Borja
              tipo: HOGAR
              descripcion: Gastos del hogar
              presupuestoInicial: 5000
              fechaInicio: '2026-11-01'
              fechaFin: '2026-11-30'
      responses:
        '201':
          description: Cartera creada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CarteraCreada'
        '400':
          description: Datos inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Token no proporcionado o inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: No se pudo crear la cartera
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    RegistroRequest:
      type: object
      required:
        - nombreUsuario
        - apaterno
        - correo
        - contrasenia
      properties:
        nombreUsuario:
          type: string
          maxLength: 80
          example: Damian
        apaterno:
          type: string
          maxLength: 80
          example: Rodriguez
        amaterno:
          type: string
          maxLength: 80
          nullable: true
          example: Alarcon
        correo:
          type: string
          maxLength: 254
          format: email
          example: prueba1@dominio.com
        contrasenia:
          type: string
          minLength: 8
          description: Mínimo 8 caracteres, al menos una mayúscula y un número.
          example: Password1
    LoginRequest:
      type: object
      required:
        - correo
        - contrasenia
      properties:
        correo:
          type: string
          format: email
          example: prueba1@dominio.com
        contrasenia:
          type: string
          example: Password1
    RefreshRequest:
      type: object
      required:
        - refresh_token
      properties:
        refresh_token:
          type: string
    Usuario:
      type: object
      properties:
        idUsuario:
          type: integer
          example: 1
        nombreUsuario:
          type: string
          example: Damian
        apaterno:
          type: string
          example: Rodriguez
        amaterno:
          type: string
          nullable: true
          example: Alarcon
        correo:
          type: string
          example: prueba1@dominio.com
        rolGlobal:
          type: string
          enum:
            - CLIENTE
            - TRABAJADOR
            - ADMIN
          example: CLIENTE
        estado:
          type: string
          enum:
            - ACTIVO
            - INACTIVO
            - ELIMINADO
          example: ACTIVO
        fechaRegistro:
          type: string
          description: Fecha en formato HTTP-date (RFC 1123).
          example: 'Wed, 21 Oct 2026 18:38:51 GMT'
    RegistroExitoso:
      type: object
      properties:
        ok:
          type: boolean
          example: true
        data:
          $ref: '#/components/schemas/Usuario'
        mensaje:
          type: string
          example: Cuenta creada correctamente.
    SesionExitosa:
      type: object
      properties:
        ok:
          type: boolean
          example: true
        data:
          type: object
          properties:
            access_token:
              type: string
            refresh_token:
              type: string
            token_type:
              type: string
              example: Bearer
            expires_in:
              type: integer
              example: 900
            usuario:
              $ref: '#/components/schemas/Usuario'
        mensaje:
          type: string
          example: Sesión iniciada correctamente.
    TokenRenovado:
      type: object
      properties:
        ok:
          type: boolean
          example: true
        data:
          type: object
          properties:
            access_token:
              type: string
            token_type:
              type: string
              example: Bearer
            expires_in:
              type: integer
              example: 900
        mensaje:
          type: string
          example: Token renovado correctamente.
    RecuperarRequest:
      type: object
      required:
        - correo
      properties:
        correo:
          type: string
          format: email
          example: prueba1@dominio.com
    RestablecerRequest:
      type: object
      required:
        - correo
        - codigo
        - contrasenia
      properties:
        correo:
          type: string
          format: email
          example: prueba1@dominio.com
        codigo:
          type: string
          minLength: 6
          maxLength: 6
          example: '123456'
        contrasenia:
          type: string
          description: Mínimo 8 caracteres, al menos una mayúscula y un número.
          example: NuevaPassword1
    RecuperacionSolicitada:
      type: object
      properties:
        ok:
          type: boolean
          example: true
        data:
          type: object
          nullable: true
          description: En producción es null. En desarrollo incluye el código para pruebas.
          properties:
            codigo:
              type: string
              example: '123456'
        mensaje:
          type: string
          example: Si el correo esta registrado, recibiras un codigo de recuperacion
    Error:
      type: object
      properties:
        ok:
          type: boolean
          example: false
        mensaje:
          type: string
          example: El correo ya está registrado.
    CarteraCrearRequest:
      type: object
      required:
        - nombre
        - tipo
      properties:
        nombre:
          type: string
          maxLength: 100
          example: Casa Borja
        tipo:
          type: string
          enum:
            - HOGAR
            - VIAJE
            - EVENTO
            - OTRO
            - OTRA
          example: HOGAR
        descripcion:
          type: string
          maxLength: 500
          nullable: true
          example: Gastos del hogar
        presupuestoInicial:
          type: number
          minimum: 0
          default: 0
          example: 5000
        fechaInicio:
          type: string
          format: date
          nullable: true
          example: '2026-11-01'
        fechaFin:
          type: string
          format: date
          nullable: true
          example: '2026-11-30'
    Cartera:
      type: object
      properties:
        id:
          type: integer
          example: 1
        nombre:
          type: string
          example: Casa Borja
        tipo:
          type: string
          enum:
            - HOGAR
            - VIAJE
            - EVENTO
            - OTRO
          example: HOGAR
        rol:
          type: string
          enum:
            - PROPIETARIO
            - COLABORADOR
          example: PROPIETARIO
        descripcion:
          type: string
          nullable: true
          example: Gastos del hogar
        estado:
          type: string
          enum:
            - ACTIVA
            - ARCHIVADA
            - FINALIZADA
          example: ACTIVA
        administrador:
          type: string
          nullable: true
          example: Damian Rodriguez
        inicialesAdministrador:
          type: string
          nullable: true
          example: DR
        presupuestoInicial:
          type: number
          example: 5000
        miPagado:
          type: number
          example: 0
        miCuota:
          type: number
          example: 0
        miSaldo:
          type: number
          example: 0
        avancePresupuesto:
          type: integer
          example: 0
        fechaInicio:
          type: string
          format: date
          nullable: true
          example: '2026-11-01'
        fechaFin:
          type: string
          format: date
          nullable: true
          example: '2026-11-30'
    CarteraCreada:
      type: object
      properties:
        ok:
          type: boolean
          example: true
        data:
          $ref: '#/components/schemas/Cartera'
        mensaje:
          type: string
          example: Cartera creada correctamente.
    CarterasLista:
      type: object
      properties:
        ok:
          type: boolean
          example: true
        data:
          type: array
          items:
            $ref: '#/components/schemas/Cartera'
        mensaje:
          type: string
          example: Carteras obtenidas correctamente.
