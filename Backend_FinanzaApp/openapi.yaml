    PaginacionTransacciones:
      type: object
      properties:
        pagina:
          type: integer
          example: 1
        porPagina:
          type: integer
          example: 20
        total:
          type: integer
          example: 35
        totalPaginas:
          type: integer
          example: 2
    TotalesPeriodo:
      type: object
      properties:
        totalIngresos:
          type: number
          example: 500
