openapi: 3.0.3
info:
  title: FinanzApp API
  description: Contrato de la API REST de FinanzApp (Flask + SQL Server).
  version: 0.4.0
servers:
  - url: http://127.0.0.1:5000
    description: Desarrollo local
tags:
  - name: Auth
    description: Registro, sesión y recuperación de cuenta
  - name: Carteras
    description: Creación y consulta de carteras
  - name: Reportes
    description: Vista previa y exportación de reportes
  - name: Comentarios
    description: Alta de comentarios desde la landing y buzón para el staff
paths:
  /auth/registro:
    post:
      tags:
        - Auth
      summary: Registrar una cuenta
      description: Crea una cuenta con rol CLIENTE y estado ACTIVO. El correo es único y la contraseña se guarda con hash.
      operationId: registrarCuenta
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistroRequest'
            example:
              nombreUsuario: Damian
              apaterno: Rodriguez
              amaterno: Alarcon
              correo: prueba1@dominio.com
              contrasenia: Password1
      responses:
        '201':
          description: Cuenta creada correctamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistroExitoso'
        '400':
          description: Datos inválidos (campos faltantes, correo mal formado o contraseña débil)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                ok: false
                mensaje: 'Faltan campos: nombreUsuario,apaterno,correo,contrasenia.'
        '409':
          description: El correo ya está registrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                ok: false
                mensaje: El correo ya está registrado.
  /auth/login:
    post:
      tags:
        - Auth
      summary: Iniciar sesión
      description: Valida credenciales y cuenta activa. Devuelve un access token JWT con el rol y un refresh token de sesión.
      operationId: iniciarSesion
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              correo: prueba1@dominio.com
              contrasenia: Password1
      responses:
        '200':
          description: Sesión iniciada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SesionExitosa'
        '400':
          description: Faltan correo o contraseña
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                ok: false
                mensaje: Correo y contraseña son obligatorios.
        '401':
          description: Credenciales incorrectas o cuenta inactiva (mensaje neutro)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                ok: false
                mensaje: Credenciales incorrectas.
  /auth/refresh:
    post:
      tags:
        - Auth
      summary: Renovar el access token
      description: Recibe el refresh token de una sesión activa y devuelve un nuevo access token.
      operationId: renovarToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
            example:
              refresh_token: egL8PpKyiAybe1d_9nLq90OIgyrFOqfIaeCrqj-GwBAhZY8CgqWDVqm7p8SHMAtD
      responses:
        '200':
          description: Token renovado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRenovado'
        '400':
          description: Falta el refresh token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Sesión inválida, revocada o expirada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                ok: false
                mensaje: Sesión inválida o expirada.
  /auth/logout:
    post:
      tags:
        - Auth
      summary: Cerrar sesión
      description: Revoca la sesión asociada al access token. El token deja de ser válido.
      operationId: cerrarSesion
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Sesión cerrada
          content:
            application/json:
              example:
                ok: true
                data: null
                mensaje: Sesión cerrada correctamente.
        '401':
          description: Token ausente, inválido, expirado o sesión ya revocada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                ok: false
                mensaje: Sesión cerrada o inválida.
  /auth/recuperar:
    post:
      tags:
        - Auth
      summary: Solicitar código de recuperación
      description: Genera un código de 6 dígitos con vigencia de 30 minutos. Siempre responde con un mensaje neutro para no revelar si el correo existe.
      operationId: solicitarRecuperacion
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecuperarRequest'
            example:
              correo: prueba1@dominio.com
      responses:
        '200':
          description: Solicitud procesada (mensaje neutro)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecuperacionSolicitada'
              example:
                ok: true
                data:
                  codigo: '123456'
                mensaje: Si el correo esta registrado, recibiras un codigo de recuperacion
        '400':
          description: Cuerpo inválido o correo con formato incorrecto
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /auth/restablecer:
    post:
      tags:
        - Auth
      summary: Restablecer contraseña con código
      description: Valida el código vigente y de un solo uso, actualiza la contraseña y revoca las sesiones activas.
      operationId: restablecerContrasenia
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RestablecerRequest'
            example:
              correo: prueba1@dominio.com
              codigo: '123456'
              contrasenia: NuevaPassword1
      responses:
        '200':
          description: Contraseña actualizada
          content:
            application/json:
              example:
                ok: true
                data: null
                mensaje: Contraseña actualizada correctamente.
        '400':
          description: Código inválido, expirado o ya usado; o contraseña que no cumple la política
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                ok: false
                mensaje: El código no es válido o ya expiró.
  /auth/cambiar:
    post:
      tags:
        - Auth
      summary: Cambiar mi contraseña en sesión
      description: Valida la contraseña actual, aplica la política y actualiza la contraseña del usuario autenticado. Las demás sesiones del usuario se revocan; la actual sigue viva.
      operationId: cambiarContrasena
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CambiarContrasenaRequest'
            example:
              actual: Password1
              nueva: NuevaPassword1
      responses:
        '200':
          description: Contraseña actualizada
          content:
            application/json:
              example:
                ok: true
                data: null
                mensaje: Contraseña actualizada correctamente.
        '400':
          description: Contraseña actual incorrecta, igual a la nueva o que no cumple la política
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Token ausente, inválido, expirado o sesión revocada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /auth/desactivar:
    post:
      tags:
        - Auth
      summary: Desactivar mi cuenta
      description: Confirma con la contraseña, marca la cuenta como INACTIVO, archiva sus carteras como propietario, la retira como colaborador y revoca sus sesiones. No borra registros ni transacciones.
      operationId: desactivarCuenta
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmacionCuentaRequest'
            example:
              contrasenia: Password1
      responses:
        '200':
          description: Cuenta desactivada
          content:
            application/json:
              example:
                ok: true
                data: null
                mensaje: Cuenta desactivada correctamente.
        '400':
          description: Contraseña incorrecta o faltante
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Token ausente, inválido, expirado o sesión revocada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /auth/cuenta:
    delete:
      tags:
        - Auth
      summary: Eliminar mi cuenta conservando transacciones
      description: Confirma con la contraseña, anonimiza los datos personales, marca la cuenta como ELIMINADO con fechaBaja, archiva sus carteras como propietario, da de baja sus colaboraciones, borra preferencias y notificaciones, quema tokens de recuperación y revoca sesiones. No borra transacciones, pagos recurrentes ni tickets. Admin y trabajador no pueden usar este endpoint.
      operationId: eliminarCuenta
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmacionCuentaRequest'
            example:
              contrasenia: Password1
      responses:
        '200':
          description: Cuenta eliminada
          content:
            application/json:
              example:
                ok: true
                data: null
                mensaje: Cuenta eliminada correctamente.
        '400':
          description: Contraseña incorrecta o faltante
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Token ausente, inválido, expirado o sesión revocada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: La cuenta es ADMIN o TRABAJADOR y no puede eliminarse desde la app
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /auth/editar_cuenta:
    put:
      tags:
        - Auth
      summary: Editar los datos de mi cuenta
      description: >-
        Actualiza el nombre (siempre obligatorio) y, cuando vienen con
        contenido, el apellido paterno, el materno y el correo. Los campos
        vacíos u omitidos conservan su valor actual. El correo nuevo debe ser
        único y estar bien formado.
      operationId: editarCuenta
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CuentaRequest'
            example:
              nombreUsuario: Aideé
              apaterno: Casillas
              amaterno: Tapia
              correo: aidee@ejemplo.com
      responses:
        '200':
          description: Cuenta actualizada; devuelve los datos vigentes del usuario
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/Usuario'
                  mensaje:
                    type: string
                    example: Cuenta actualizada correctamente.
        '400':
          description: >-
            Datos inválidos: nombre vacío o mayor a 80 caracteres, apellidos
            mayores a 80 o correo mal formado o mayor a 254
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Token ausente, inválido, expirado o sesión revocada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: El correo ya pertenece a otra cuenta
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: No se pudo actualizar la cuenta
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /auth/preferencias:
    get:
      tags:
        - Auth
      summary: Obtener mis preferencias
      description: >-
        Devuelve el tema y los interruptores de notificación del usuario
        autenticado. Si nunca guardó preferencias, devuelve los valores por
        defecto: tema CLARO y los tres avisos activados.
      operationId: obtenerPreferencias
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Preferencias del usuario
          content:
            application/json:
              example:
                ok: true
                data:
                  tema: CLARO
                  notificacionesMovimientos: true
                  notificacionesSistema: true
                  notificacionesPagos: true
                mensaje: Preferencia obtenida.
        '401':
          description: Token ausente, inválido, expirado o sesión revocada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      tags:
        - Auth
      summary: Guardar mis preferencias
      description: >-
        Crea o actualiza las preferencias enviadas. Todos los campos son
        opcionales, pero debe venir al menos uno. Los avisos aplican de
        inmediato y se conservan entre sesiones.
      operationId: guardarPreferencias
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PreferenciasRequest'
            example:
              notificacionesMovimientos: false
      responses:
        '200':
          description: Preferencias guardadas
          content:
            application/json:
              example:
                ok: true
                data:
                  tema: CLARO
                  notificacionesMovimientos: false
                  notificacionesSistema: true
                  notificacionesPagos: true
                mensaje: Preferencia guardada.
        '400':
          description: Cuerpo inválido, tema distinto de CLARO/OSCURO, aviso no booleano o sin campos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Token ausente, inválido, expirado o sesión revocada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /carteras:
    get:
      tags:
        - Carteras
      summary: Listar mis carteras
      description: Devuelve las carteras activas donde el usuario es propietario o colaborador.
      operationId: listarCarteras
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: estado
          required: false
          description: Estado de la cartera. Por defecto solo activas.
          schema:
            type: string
            enum:
              - ACTIVA
              - ARCHIVADA
              - FINALIZADA
            default: ACTIVA
        - in: query
          name: tipo
          required: false
          description: Tipo de cartera.
          schema:
            type: string
            enum:
              - HOGAR
              - VIAJE
              - EVENTO
              - OTRO
              - OTRA
        - in: query
          name: rol
          required: false
          description: Rol del usuario en la cartera.
          schema:
            type: string
            enum:
              - PROPIETARIO
              - COLABORADOR
        - in: query
          name: busqueda
          required: false
          description: Texto a buscar en el nombre de la cartera.
          schema:
            type: string
      responses:
        '200':
          description: Listado de carteras
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CarterasLista'
        '400':
          description: Filtro inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Token no proporcionado o inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: No se pudieron obtener las carteras
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      tags:
        - Carteras
      summary: Crear una cartera
      description: Crea una cartera con el usuario actual como propietario y estado ACTIVA.
      operationId: crearCartera
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CarteraCrearRequest'
            example:
              nombre: Casa Borja
              tipo: HOGAR
              descripcion: Gastos del hogar
              presupuestoInicial: 5000
              fechaInicio: '2026-11-01'
              fechaFin: '2026-11-30'
      responses:
        '201':
          description: Cartera creada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CarteraCreada'
        '400':
          description: Datos inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Token no proporcionado o inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: No se pudo crear la cartera
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /carteras/{idCartera}/invitaciones:
    get:
      tags:
        - Invitaciones
      summary: Consultar la invitación activa y los ingresos
      description: >-
        Devuelve la invitación activa de la cartera y los colaboradores que se
        han unido con fecha y hora. Solo el propietario o administrador puede
        consultarla.
      operationId: consultarInvitacion
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: idCartera
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Invitación y colaboradores que ingresaron
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitacionesCartera'
        '401':
          description: Token no proporcionado o inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: El usuario no es propietario o administrador
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Cartera no encontrada o el usuario no es miembro
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: No se pudo obtener la invitación
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      tags:
        - Invitaciones
      summary: Generar el QR de invitación
      description: >-
        Genera una clave única de 8 caracteres y revoca la invitación activa
        anterior. Solo el propietario o administrador puede generarla y la
        cartera debe estar ACTIVA. El front renderiza el QR a partir de
        qrContenido.
      operationId: generarInvitacion
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: idCartera
          required: true
          schema:
            type: integer
      responses:
        '201':
          description: Invitación generada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitacionGenerada'
        '401':
          description: Token no proporcionado o inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: El usuario no es propietario o administrador
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Cartera no encontrada o el usuario no es miembro
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: La cartera está inactiva o finalizada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: No se pudo generar la invitación
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /invitaciones/unirse:
    post:
      tags:
        - Invitaciones
      summary: Unirse a una cartera con la clave
      description: >-
        Valida la clave de 8 caracteres, su vigencia y que la cartera esté
        ACTIVA, y da de alta al usuario como colaborador activo con la fecha
        y hora de ingreso. Si ya es miembro activo, rechaza la petición.
      operationId: unirseCartera
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UnirseRequest'
            example:
              codigo: ABCD2345
      responses:
        '201':
          description: El usuario se unió a la cartera
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnionCartera'
        '400':
          description: Clave con formato inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Token no proporcionado o inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Invitación no encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Invitación vencida/revocada, cartera inactiva o ya es miembro
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: No se pudo unir a la cartera
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /carteras/{idCartera}:
    get:
      tags:
        - Carteras
      summary: Detalle de una cartera
      description: >-
        Devuelve los datos de la cartera, sus miembros activos, el resumen de
        saldo y totales, y las series para las gráficas (ingresos vs egresos
        por periodo y gastos por categoría). Las transacciones eliminadas no
        se incluyen. Si se envía periodoId, se agrega resumenPeriodo y los
        gastos por categoría se filtran a ese periodo. Si la cartera está
        FINALIZADA, se agrega balance total, por categoría y por participante.
      operationId: obtenerDetalleCartera
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: idCartera
          required: true
          schema:
            type: integer
        - in: query
          name: periodoId
          required: false
          description: Periodo presupuestal para filtrar resumen y gastos por categoría.
          schema:
            type: integer
      responses:
        '200':
          description: Detalle de la cartera
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/CarteraDetalle'
                  mensaje:
                    type: string
                    example: Cartera obtenida correctamente.
        '400':
          description: Periodo inválido o ajeno a la cartera
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Token no proporcionado o inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Cartera no encontrada o el usuario no es miembro
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: No se pudo obtener el detalle
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      tags:
        - Carteras
      summary: Editar una cartera
      description: >-
        Actualiza nombre, descripción, tipo, presupuesto inicial y fechas de una
        cartera. Solo el propietario o administrador puede hacerlo y la cartera
        no debe estar FINALIZADA. No elimina datos.
      operationId: editarCartera
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: idCartera
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
