name: ci-develop

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - working-directory: Backend_FinanzaApp
        run: |
          pip install -r requirements.txt
          pip install pytest
          python -m pytest -q

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          cache: npm
          cache-dependency-path: web_FinanzaApp/package-lock.json
      - working-directory: web_FinanzaApp
        run: |
          npm ci
          npm run lint
          npm run build

  movil:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - working-directory: movil_FinanzaApp
        run: ./gradlew testDebugUnitTest --stacktrace
